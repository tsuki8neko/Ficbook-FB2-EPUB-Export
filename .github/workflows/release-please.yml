name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check PAT secret
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PAT_TOKEN IS EMPTY"
            exit 1
          fi

          echo "PAT_TOKEN exists"
          echo "Length: ${#GH_TOKEN}"
          echo "Prefix: ${GH_TOKEN:0:4}..."
          gh api user --jq .login

      - name: Trigger release-build workflow
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh workflow run release-build.yml --repo "$GITHUB_REPOSITORY"
